  check: "not quantity_equals_exactly_one_permitted_base_unit or exact_one_unit_uses_only_permitted_equivalent_unit == true"
  # confirmed against Rule 13(3) proviso, LMPC 2011

- id: NO_DOZEN_SCORE_GROSS_UNITS
  description: "The package does not state a quantity using dozen, score, gross, great gross, or a like counting term."
