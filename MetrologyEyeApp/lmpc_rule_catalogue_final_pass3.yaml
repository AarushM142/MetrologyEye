# Third-pass gap-fill and consistency pass for the LMPC 2011 catalogue.
# Base PDF: 43 pages; parsed text reviewed across the full PDF. Page images were used where available, including the numeric tables on pages 8-9 and 28-32.
# Current-law additions in this pass include G.S.R. 456(E) (23 June 2023), the G.S.R. 629(E) country-of-origin/best-before additions, and machine-checkable Fourth Schedule declarations not previously catalogued.

- id: NET_QUANTITY_DECLARED
  description: "The package states the net quantity of the commodity."
  citation: "Rule 6(1)(c), LMPC 2011"
  verified: true
  severity: VIOLATION
  check: "net_quantity_present == true"
  # confirmed against Rule 6(1)(c), LMPC 2011

- id: NET_QUANTITY_UOM_STANDARD
  description: "The net quantity is expressed using a unit of weight, measure, or number that gives accurate and adequate quantity information."
  citation: "Rule 12(1), LMPC 2011"
  verified: true
  severity: VIOLATION
  check: "net_quantity_unit != null"
  # confirmed against Rule 12(1), LMPC 2011

- id: SOLID_MASS_UNIT
  description: "A solid, semi-solid, viscous, or solid-liquid mixture is declared by mass unless a Fourth Schedule exception applies."
  citation: "Rule 12(2)(a), LMPC 2011"
  verified: true
  severity: VIOLATION
  check: "commodity_form not in ['solid','semi-solid','viscous','solid_liquid_mixture'] or net_quantity_measure_type == 'mass' or fourth_schedule_exception == true"
  # confirmed against Rule 12(2)(a), LMPC 2011

- id: LINEAR_MEASURE_LENGTH_UNIT
  description: "A commodity sold by linear measure is declared in units of length unless a Fourth Schedule exception applies."
  citation: "Rule 12(2)(b), LMPC 2011"
  verified: true
  severity: VIOLATION
  check: "not sold_by_linear_measure or net_quantity_measure_type == 'length' or fourth_schedule_exception == true"
  # confirmed against Rule 12(2)(b), LMPC 2011

- id: AREA_MEASURE_AREA_UNIT
  description: "A commodity sold by area measure is declared in units of area unless a Fourth Schedule exception applies."
  citation: "Rule 12(2)(c), LMPC 2011"
  verified: true
  severity: VIOLATION
  check: "not sold_by_area_measure or net_quantity_measure_type == 'area' or fourth_schedule_exception == true"
  # confirmed against Rule 12(2)(c), LMPC 2011

- id: LIQUID_VOLUME_UNIT
  description: "A liquid commodity or commodity sold by cubic measure is declared by volume unless a Fourth Schedule exception applies."
  citation: "Rule 12(2)(d), LMPC 2011"
  verified: true
  severity: VIOLATION
  check: "(commodity_form != 'liquid' and not sold_by_cubic_measure) or net_quantity_measure_type == 'volume' or fourth_schedule_exception == true"
  # confirmed against Rule 12(2)(d), LMPC 2011

- id: NUMBER_SOLD_NUMBER_DECLARATION
  description: "A commodity sold by number is declared in terms of number unless a Fourth Schedule exception applies."
  citation: "Rule 12(2)(e), LMPC 2011"
  verified: true
  severity: VIOLATION
  check: "not sold_by_number or net_quantity_measure_type == 'number' or fourth_schedule_exception == true"
  # confirmed against Rule 12(2)(e), LMPC 2011

