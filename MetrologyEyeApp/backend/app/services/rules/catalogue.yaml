# =============================================================================
# Legal Metrology rule catalogue
# =============================================================================
# Single edit point for statutory content. Each rule carries its citation, severity,
# and message template; `engine.py` holds only the predicate implementations, keyed by
# `check`. Correcting a citation is a one-line change here — no code, no redeploy.
#
# ---------------------------------------------------------------------------
# !! EVERY CITATION BELOW IS `verified: false`. !!
# ---------------------------------------------------------------------------
# The references are transcribed from the project specification, NOT from the official
# statute — legalmetrology.gov.in, indiacode.nic.in and indiankanoon.org were all
# unreachable from the build environment. `verified: false` is returned in the API
# response and stamped on the generated notice, so an unchecked citation can never be
# mistaken for a confirmed one.
#
# To verify: open the LMPC Rules 2011 and the Legal Metrology Act 2009, confirm each
# `citation` string, then set `verified: true` on that rule only.
# =============================================================================

meta:
  statute: "Legal Metrology (Packaged Commodities) Rules, 2011"
  act: "Legal Metrology Act, 2009"
  catalogue_version: "0.1.0"

# Declarations required on every retail package. One MISSING_DECLARATION finding is
# emitted per absent field, each with its own box-less entry in the notice.
mandatory_declarations:
  - commodity_name
  - manufacturer_name
  - manufacturer_address
  - net_quantity
  - mrp
  - manufacture_date
  - consumer_care
  - country_of_origin

# best_before and fssai_number are commodity-specific (food) rather than universal, so
# their absence is advisory. Promoting these to mandatory is a two-line move: add to the
# list above and delete from here.
advisory_declarations:
  - best_before
  - fssai_number

rules:
  - id: MISSING_DECLARATION
    check: missing_declaration
    severity: VIOLATION
    citation: "Rule 6(1), Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: >-
      Every mandatory declaration must appear on the principal display panel of a retail
      package.
    message: "Mandatory declaration '{label}' is not present on the label."
    expected: "Declaration must be present"

  - id: MISSING_ADVISORY
    check: missing_advisory
    severity: WARNING
    citation: "Rule 6(1), Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: >-
      Commodity-specific declarations that are required for some categories (notably
      pre-packaged food) but not for all packages.
    message: "Declaration '{label}' is absent. Required for food commodities; verify applicability."
    expected: "Present if the commodity category requires it"

  - id: UNIT_NONSTANDARD
    check: unit_nonstandard
    severity: VIOLATION
    citation: "Rule 13, Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: >-
      Net quantity must be declared using the standard SI unit symbols. Colloquial or
      pluralised abbreviations are not permitted symbols.
    message: "Net quantity uses non-standard unit '{observed_unit}'. The permitted symbol is '{correct_unit}'."
    params:
      # Non-standard form -> permitted symbol. Matched case-insensitively on a word
      # boundary against the net-quantity declaration.
      substitutions:
        gms: "g"
        gm: "g"
        grams: "g"
        gram: "g"
        gr: "g"
        kgs: "kg"
        kilo: "kg"
        kilos: "kg"
        kilogram: "kg"
        kilograms: "kg"
        ltr: "l"
        ltrs: "l"
        lt: "l"
        lts: "l"
        litre: "l"
        litres: "l"
        liter: "l"
        liters: "l"
        mls: "ml"
        mgs: "mg"

  - id: UNIT_MISSING
    check: unit_missing
    severity: VIOLATION
    citation: "Rule 13, Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: Net quantity must state a unit of weight, measure or number.
    message: "Net quantity '{observed}' does not state a recognised unit of measure."
    expected: "Quantity followed by a permitted unit symbol (g, kg, ml, l, mg, cm, m, N)"

  - id: MRP_FORMAT_INVALID
    check: mrp_format
    severity: VIOLATION
    citation: "Rule 6(1)(e), Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: >-
      Retail sale price must be declared in the form of an amount in rupees, with the
      currency indicated.
    message: "MRP '{observed}' is not a valid price declaration in rupees."
    expected: "e.g. 'MRP Rs. 145.00 (inclusive of all taxes)'"

  - id: MRP_TAX_WORDING_MISSING
    check: mrp_tax_wording
    severity: VIOLATION
    citation: "Rule 6(1)(e), Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: >-
      The retail sale price must be declared as the maximum price inclusive of all taxes.
    message: "MRP is declared without the required 'inclusive of all taxes' wording."
    expected: "'Maximum Retail Price Rs. <amount> (inclusive of all taxes)'"
    params:
      # Any one of these phrases anywhere in the label text satisfies the rule; the
      # wording sits next to the price rather than inside the extracted MRP value.
      accepted_phrases:
        - "inclusive of all taxes"
        - "incl. of all taxes"
        - "incl of all taxes"
        - "inclusive of all tax"
        - "including all taxes"
        - "inc. of all taxes"
        - "maximum retail price incl"

  - id: MFG_DATE_INVALID
    check: mfg_date
    severity: VIOLATION
    citation: "Rule 6(1)(d), Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: >-
      The month and year of manufacture, pre-packing or import must be declared and must
      be a real, plausible date.
    message: "Date of manufacture '{observed}' could not be read as a valid month and year."
    expected: "Month and year, e.g. '03/2026' or 'MAR 2026'"
    params:
      earliest_year: 2015
      # A manufacture date in the future is not a legible-date problem, it is a
      # false declaration — hence a separate message rather than the same one.
      future_message: "Date of manufacture '{observed}' is in the future."

  - id: FONT_HEIGHT_BELOW_MIN
    check: font_height
    severity: WARNING
    citation: "Rule 9, Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: >-
      Declarations must be legible and printed at not less than the prescribed minimum
      letter height.
    message: >-
      Letter height of '{label}' measures approximately {observed_mm} mm, below the
      {min_mm} mm minimum. Advisory only: derived from an assumed barcode print
      magnification and must be confirmed with a physical measurement.
    params:
      # Conservative single threshold. The statute's Sixth Schedule scales the minimum
      # with the area of the principal display panel; we cannot measure panel area from a
      # single photograph, so the smallest tier is applied and the finding is advisory.
      # UNVERIFIED — confirm against the Schedule before relying on this number.
      min_height_mm: 1.0
      # Only flag a clear shortfall. Within this band the measurement error of the
      # magnification assumption exceeds the discrepancy being reported.
      tolerance_mm: 0.15

  - id: DECLARATION_PRESENT
    check: compliant_marker
    severity: COMPLIANT
    citation: "Rule 6(1), Legal Metrology (Packaged Commodities) Rules, 2011"
    verified: false
    description: >-
      Not a violation rule. Emits a green finding for each declaration that passed every
      applicable check, so the evidence viewer shows what was verified and not only what
      failed.
    message: "'{label}' is present and passed all applicable checks."

# Human-readable field names for messages and for the Form-I notice table.
field_labels:
  commodity_name: "Name of commodity"
  manufacturer_name: "Name of manufacturer / packer / importer"
  manufacturer_address: "Address of manufacturer / packer / importer"
  net_quantity: "Net quantity"
  mrp: "Retail sale price (MRP)"
  manufacture_date: "Month and year of manufacture / packing"
  best_before: "Best before / use by"
  consumer_care: "Consumer care details"
  country_of_origin: "Country of origin"
  fssai_number: "FSSAI licence number"
